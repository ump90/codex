name: sync-upstream

on:
  workflow_dispatch:
    inputs:
      upstream_repository:
        description: "Repository to sync from."
        required: true
        default: "openai/codex"
      target_branch:
        description: "Branch to update in this repository."
        required: true
        default: "main"
  schedule:
    # Daily at 04:00 Asia/Shanghai.
    - cron: "0 20 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_branch || 'main' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: Merge latest upstream release into ${{ inputs.target_branch || 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest published upstream release (including prereleases)
        env:
          UPSTREAM_REPOSITORY: ${{ inputs.upstream_repository || 'openai/codex' }}
          TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Keep the workflow's helper when switching to the upstream mirror,
          # which may not contain fork-only scripts yet.
          cp .github/scripts/sync_upstream_release.py "${RUNNER_TEMP}/sync_upstream_release.py"
          git fetch origin "${TARGET_BRANCH}"
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"

          python3 "${RUNNER_TEMP}/sync_upstream_release.py" --repository "${UPSTREAM_REPOSITORY}"
          git push origin "HEAD:${TARGET_BRANCH}"
